<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竞价反查 | 睿哥</title>
<style>
:root{
  --bg:#0d1117; --card:#161b22; --card2:#1c2030; --border:#30363d;
  --text:#c9d1d9; --dim:#8b949e; --accent:#58a6ff; --ok:#3fb950;
  --up:#ff4d4f; --down:#2ed573; --amber:#d29922;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);line-height:1.6;padding:20px 16px 48px;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;
  max-width:1100px;margin:0 auto;min-height:100vh;}
a{color:var(--accent);text-decoration:none;}
.nav{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap;}
.nav a{font-size:.85em;padding:6px 14px;border:1px solid var(--border);border-radius:6px;transition:all .2s;}
.nav a:hover{background:rgba(88,166,255,.1);}
.nav a.active{background:var(--accent);color:#0d1117;border-color:var(--accent);font-weight:600;}
.hero{text-align:center;padding:28px 16px 26px;border-bottom:1px solid var(--border);margin-bottom:26px;}
.hero h1{font-size:2em;color:#fff;margin-bottom:8px;letter-spacing:.5px;}
.hero .sub{color:var(--dim);font-size:.9em;}
section{margin-bottom:34px;}
section h2{font-size:1.12em;color:var(--accent);margin-bottom:16px;padding-bottom:9px;
  border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.tag{font-size:.72em;font-weight:400;color:var(--dim);border:1px solid var(--border);
  border-radius:20px;padding:2px 10px;}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
.card{display:block;background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:16px 14px;text-align:center;color:var(--text);transition:all .18s;position:relative;}
.card.ok:hover{border-color:var(--accent);transform:translateY(-2px);
  box-shadow:0 4px 18px rgba(88,166,255,.12);}
.card.off{opacity:.42;cursor:not-allowed;}
.card .icon{font-size:1.7em;}
.card .name{font-size:.98em;color:#fff;font-weight:600;margin-top:6px;}
.card .tm{font-size:.75em;color:var(--dim);margin-top:2px;}
.card .badge{display:inline-block;margin-top:9px;font-size:.7em;padding:2px 9px;border-radius:20px;}
.badge.ok{background:rgba(63,185,80,.14);color:var(--ok);border:1px solid rgba(63,185,80,.3);}
.badge.off{background:rgba(139,148,158,.1);color:var(--dim);border:1px solid var(--border);}
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--card);}
table{border-collapse:collapse;width:100%;font-size:.86em;min-width:640px;}
th,td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap;}
th{background:var(--card2);color:var(--dim);font-weight:600;font-size:.92em;position:sticky;top:0;}
tbody tr:hover{background:rgba(88,166,255,.05);}
td.dt{text-align:left;padding-left:14px;color:var(--text);font-weight:600;}
td.dt .w{color:var(--dim);font-weight:400;font-size:.85em;margin-left:4px;}
.dot{display:inline-block;width:26px;height:20px;line-height:20px;border-radius:5px;
  font-size:.72em;font-weight:600;}
.dot.y{background:rgba(63,185,80,.16);color:var(--ok);border:1px solid rgba(63,185,80,.32);}
.dot.n{background:rgba(139,148,158,.07);color:#4a5260;border:1px solid var(--border);}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;}
.list a{display:block;background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:11px 14px;color:var(--text);font-size:.9em;transition:all .18s;}
.list a:hover{border-color:var(--accent);color:var(--accent);}
.foot{text-align:center;margin-top:40px;padding-top:18px;border-top:1px solid var(--border);
  color:var(--dim);font-size:.82em;line-height:1.9;}
</style>
</head>
