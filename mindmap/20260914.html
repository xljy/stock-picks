/* ============ 树构建 ============ */
function buildTree(){
  const root = {id:'root', type:'root', name:DATA.meta.date,
    sub:`${DATA.meta.zt_count}家涨停 · 最高${DATA.meta.max_lb}板`,
    sub2:`炸板${DATA.meta.zb_count??'-'}家 · ${DATA.meta.theme_count}个主题域 · ${DATA.meta.topic_count}个细分题材`,
    children:[], color:'#0a66c2'};
  DATA.themes.forEach((th,ti)=>{
    const tn = {id:'t'+ti, type:'theme', name:th.name, color:th.color,
      count:th.count, max_lb:th.max_lb, children:[], raw:th};
    th.topics.forEach((tp,pi)=>{
      const pn = {id:`t${ti}_${pi}`, type:'topic', name:tp.name, color:th.color,
        count:tp.count, max_lb:tp.max_lb, children:[], parent:tn, raw:tp, collapsed:true};
      tp.stocks.forEach((s,si)=>{
        pn.children.push({id:`t${ti}_${pi}_${si}`, type:'stock', name:s.name,
          color:th.color, raw:s, parent:pn, children:[]});
      });
      tn.children.push(pn);
    });
    root.children.push(tn);
  });
  return root;
}

/* ============ 布局 ============ */
const NW=[218,206,196,214], NH=[80,50,38,42], COLX=[36,300,556,802], RG=9, TG=20;
let ROOT=buildTree(), FLAT=[], VW=1100, VH=800;

function layout(){
  FLAT=[]; let y=0;
  (function walk(n,d){
    n.depth=d; n.x=COLX[d]; n.w=NW[d]; n.h=NH[d]; FLAT.push(n);
    if(n.collapsed || !n.children.length){
      n.y=y+n.h/2; y+=n.h+RG;
    }else{
      n.children.forEach(c=>walk(c,d+1));
      const f=n.children[0], l=n.children[n.children.length-1];
      n.y=(f.y+l.y)/2;
      if(d===1) y+=TG;
      if(d===2) y+=4;
    }
  })(ROOT,0);
  VH=Math.max(y,600); VW=COLX[3]+NW[3]+40;
}

/* ============ 渲染 ============ */
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('stage');
let TX=0,TY=0,SC=1;

function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function lbColor(n){const l=n.raw?n.raw.lb:1;
  return l>=5?'#a21caf':l>=4?'#dc2626':l>=3?'#ef4444':l>=2?'#f59e0b':'#4b5b70';}
function fmtYi(v){v=v/1e8; return v>=1?v.toFixed(2)+'亿':(v*10000>=1?Math.round(v*10000)+'万':'0');}
function fmtTime(t){return t?t.slice(0,5):'--';}
function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function nodeBody(n){
  const g=el('g',{class:'node','data-id':n.id});
  const r=el('rect',{class:'nd',x:n.x,y:n.y-n.h/2,width:n.w,height:n.h,rx:9,
    fill:'#ffffff',stroke:n.color,'stroke-width':n.type==='root'?2:1.4,
    'stroke-opacity':n.type==='stock'?.45:.9});
  if(n.type==='theme'||n.type==='topic'||n.type==='root'){
    r.setAttribute('fill',hexA(n.color,n.type==='topic'?.07:.13));
  }
  g.appendChild(r);
  // 左侧色条
  if(n.type!=='root'){
    g.appendChild(el('rect',{x:n.x,y:n.y-n.h/2,width:3.5,height:n.h,rx:2,
      fill:n.color,'fill-opacity':n.type==='stock'?.65:1}));
  }

  if(n.type==='root'){
    g.appendChild(txt(n.x+14,n.y-16,n.name,15,'#111418',700));
    g.appendChild(txt(n.x+14,n.y+5,n.sub,12,'#cf222e',700));
    g.appendChild(txt(n.x+14,n.y+23,n.sub2,10.5,'#5b6570'));
  }
  else if(n.type==='theme'){
    g.appendChild(txt(n.x+14,n.y-7,n.name,14,'#1f2328',700));
    g.appendChild(txt(n.x+14,n.y+13,`${n.count}家 · 最高${n.max_lb}板`,11,'#5b6570'));
    g.appendChild(badgeR(n.x+n.w-10,n.y,`${n.count}`,n.color));
  }
  else if(n.type==='topic'){
    g.appendChild(txt(n.x+13,n.y+1,n.name,12.5,'#1f2328',600));
    g.appendChild(badgeR(n.x+n.w-10,n.y,`${n.count}`,hexA(n.color,.9),true));
  }
  else{
    const s=n.raw;
    g.appendChild(txt(n.x+12,n.y-6,s.name,13.5,'#1f2328',700));
    g.appendChild(badgeR(n.x+n.w-10,n.y-6,`${s.lb}板`,lbColor(n)));
    if(SHOWLABEL){
      const bt=s.board_type?s.board_type.replace('(涨停)',''):'';
      g.appendChild(txt(n.x+12,n.y+13,
        `封单${fmtYi(s.seal_amt)} · ${bt||s.lb_stat||''} · ${fmtTime(s.first_time)}`,
        10.5,'#5b6570'));
    }
  }
  return g;
}
function txt(x,y,s,size,fill,weight){
  const t=el('text',{x,y,'font-size':size,fill});
  if(weight)t.setAttribute('font-weight',weight);
  t.textContent=s; return t;
}
function badgeR(x,y,s,color,small){
  const w=String(s).length*(small?8:9)+14, h=small?17:19;
  const g=el('g',{});
  g.appendChild(el('rect',{x:x-w,y:y-h/2,width:w,height:h,rx:h/2,fill:color,'fill-opacity':.19,
    stroke:color,'stroke-opacity':.75,'stroke-width':1}));
  g.appendChild(txt(x-w/2,y+4,s,small?10.5:11.5,color,700)).setAttribute('text-anchor','middle');
  return g;
}
function hexA(h,a){
  const n=parseInt(h.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}

function render(){
  svg.innerHTML='';
  const defs=el('defs',{}); svg.appendChild(defs);
  const gL=el('g',{id:'links'}), gN=el('g',{id:'nodes'});
  svg.appendChild(gL); svg.appendChild(gN);
  FLAT.forEach(n=>{
    if(!n.parent) return;
    const x1=n.parent.x+n.parent.w, y1=n.parent.y, x2=n.x, y2=n.y;
    const dx=Math.max((x2-x1)/2, 26);
    const p=el('path',{class:'lk',id:'p_'+n.id,
      d:`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`,
      stroke:n.color,'stroke-opacity':n.type==='stock'?.32:.55});
    gL.appendChild(p);
  });
  FLAT.forEach(n=>{const g=nodeBody(n); gN.appendChild(g);});
  applyFilter();
  fit();
}
function transform(){
  document.getElementById('links').setAttribute('transform',`translate(${TX},${TY}) scale(${SC})`);
  document.getElementById('nodes').setAttribute('transform',`translate(${TX},${TY}) scale(${SC})`);
}

/* ============ 交互 ============ */
let SHOWLABEL=true, HIDE_LONE=false, SHOW_CROSS=false;
const main=document.getElementById('main'), tip=document.getElementById('tip');

function fit(){
  const W=main.clientWidth||1000, H=main.clientHeight||700;
  let s = Math.min((W-40)/VW, (H-40)/VH);
  s = Math.min(Math.max(s, 0.4), 1.4);
  SC=s; TX=Math.max(20,(W-VW*s)/2); TY=Math.max(12,(H-VH*s)/2);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  transform();
}
function set100(){
  const r=main.getBoundingClientRect();
  const W=r.width||1000, H=r.height||700;
  SC=1; TX=Math.max(0,(W-VW)/2); TY=Math.max(0,(H-VH)/2);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  transform();
}
function zoom(f){
  const r=main.getBoundingClientRect();
  const cx=r.width/2, cy=r.height/2;
  TX=cx-(cx-TX)*f; TY=cy-(cy-TY)*f; SC*=f; transform();
}
main.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:1/1.12);},{passive:false});
let drag=null;
main.addEventListener('mousedown',e=>{if(e.target.closest('.node'))return;
  drag={x:e.clientX-TX,y:e.clientY-TY};main.classList.add('drag');});
window.addEventListener('mousemove',e=>{if(drag){TX=e.clientX-drag.x;TY=e.clientY-drag.y;transform();}});
window.addEventListener('mouseup',()=>{drag=null;main.classList.remove('drag');});

svg.addEventListener('click',e=>{
  const g=e.target.closest('.node'); if(!g) return;
  const n=FLAT.find(x=>x.id===g.dataset.id); if(!n) return;
  if(n.type==='stock'){ showDetail(n.raw); return; }
  n.collapsed=!n.collapsed; layout(); render(); transform();
});
svg.addEventListener('mousemove',e=>{
  const g=e.target.closest('.node');
  if(!g){tip.style.opacity=0;
    document.querySelectorAll('path.lk.hi').forEach(p=>p.classList.remove('hi'));return;}
  const n=FLAT.find(x=>x.id===g.dataset.id); if(!n){return;}
  // 高亮祖先链
  document.querySelectorAll('path.lk.hi').forEach(p=>p.classList.remove('hi'));
  let c=n; while(c.parent){const p=document.getElementById('p_'+c.id); if(p)p.classList.add('hi'); c=c.parent;}
  const r=main.getBoundingClientRect();
  let t='';
  if(n.type==='stock'){const s=n.raw;
    t=`${s.name} ${s.code} · ${s.lb}板 · 封单${fmtYi(s.seal_amt)} · 换手${s.turnover.toFixed(1)}%`;}
  else if(n.type==='topic') t=`${n.name} · ${n.count}家 · 最高${n.max_lb}板`;
  else if(n.type==='theme') t=`${n.name} · ${n.count}家 · 最高${n.max_lb}板`;
  else t=`${DATA.meta.date} 涨停${DATA.meta.zt_count}家`;
  tip.textContent=t; tip.style.opacity=1;
  tip.style.left=Math.min(e.clientX-r.left+14, r.width-260)+'px';
  tip.style.top=(e.clientY-r.top+16)+'px';
});
svg.addEventListener('mouseleave',()=>{tip.style.opacity=0;});

/* ---- 主题域筛选 ---- */
const themeState={};
function initThemes(){
  const box=document.getElementById('themes');
  box.innerHTML=DATA.themes.map((t,i)=>`
    <div class="ti" data-i="${i}">
      <div class="dot" style="background:${t.color}"></div>
      <div class="n">${esc(t.name)}</div><div class="c">${t.count}</div>
    </div>`).join('');
  box.querySelectorAll('.ti').forEach(d=>{
    d.onclick=()=>{const i=d.dataset.i;
      themeState[i]=!themeState[i]; d.classList.toggle('off',!!themeState[i]);
      applyFilter();};
  });
}
function applyFilter(){
  FLAT.forEach(n=>{
    const g=document.querySelector(`.node[data-id="${n.id}"]`);
    const p=document.getElementById('p_'+n.id);
    let dim=false;
    if(n.type==='theme'&&themeState[n.raw?DATA.themes.indexOf(n.raw):-1]) dim=true;
    else if(n.parentType) {}
    if(n.type==='topic'&&themeState[n.parent?DATA.themes.indexOf(n.parent.raw):-1]) dim=true;
    if(n.type==='stock'&&themeState[n.parent&&n.parent.parent?DATA.themes.indexOf(n.parent.parent.raw):-1]) dim=true;
    if(HIDE_LONE&&n.type==='topic'&&n.count===1) dim=true;
    if(g)g.classList.toggle('dim',dim);
    if(p)p.style.opacity=dim?.06:'';
  });
  if(Q){highlight(Q);}
}

let Q='';
function highlight(q){
  Q=q=q.trim();
  document.querySelectorAll('.node').forEach(g=>g.classList.remove('dim'));
  if(!q){applyFilter();return;}
  FLAT.forEach(n=>{
    if(n.type==='root')return;
    const s=n.raw;
    let hit=false;
    if(n.type==='stock') hit=s.name.includes(q)||s.code.includes(q)||
      (s.reason_text||'').includes(q)||(s.reason_tags||[]).some(t=>t.includes(q));
    else hit=n.name.includes(q);
    const g=document.querySelector(`.node[data-id="${n.id}"]`);
    if(g)g.classList.toggle('dim',!hit);
  });
}
document.getElementById('q').addEventListener('input',e=>highlight(e.target.value));

/* ---- 工具按钮 ---- */
function setAll(c){FLAT.forEach(n=>{if(n.type!=='stock')n.collapsed=c;});layout();render();transform();}
document.getElementById('bFit').onclick=fit;
document.getElementById('b100').onclick=set100;
document.getElementById('bExpand').onclick=()=>setAll(false);
document.getElementById('bCollapse2').onclick=()=>{setAll(false);
  FLAT.forEach(n=>{if(n.type==='topic')n.collapsed=true;});layout();render();transform();};
document.getElementById('bCollapse1').onclick=()=>{setAll(true);};
document.getElementById('cCross').onchange=e=>{
  SHOW_CROSS=e.target.checked;
  location.hash='cross'; // 交叉题材需服务端重建，提示用户
  if(SHOW_CROSS) alert('交叉题材需在生成时开启：python build_mindmap.py --cross');

document.getElementById('cLone').onchange=e=>{HIDE_LONE=e.target.checked;applyFilter();};
document.getElementById('cLabel').onchange=e=>{SHOWLABEL=e.target.checked;render();transform();};
document.getElementById('zIn').onclick=()=>zoom(1.2);
document.getElementById('zOut').onclick=()=>zoom(1/1.2);

document.getElementById('tDetail').onclick=()=>{
  document.getElementById('tDetail').classList.add('on');
  document.getElementById('tRank').classList.remove('on');
  document.getElementById('detail').classList.remove('hide');
  document.getElementById('rank').classList.add('hide');};

/* ---- 导出 ---- */
function svgBlob(){
  const c=svg.cloneNode(true);
  c.setAttribute('xmlns',NS);
  c.setAttribute('width',VW); c.setAttribute('height',VH);
  c.setAttribute('viewBox',`0 0 ${VW} ${VH}`);
  c.querySelector('#links').setAttribute('transform','translate(0,0) scale(1)');
  c.querySelector('#nodes').setAttribute('transform','translate(0,0) scale(1)');
  const st=document.createElement('style');
  st.textContent='text{font-family:"Microsoft YaHei",sans-serif}';
  c.insertBefore(st,c.firstChild);
  return new XMLSerializer().serializeToString(c);
}
document.getElementById('bSvg').onclick=()=>{
  const b=new Blob([svgBlob()],{type:'image/svg+xml'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=`涨停思维导图_${DATA.meta.date}.svg`;a.click();};
document.getElementById('bPng').onclick=()=>{
  const img=new Image();
  img.onload=()=>{const cv=document.createElement('canvas');
    cv.width=VW*2;cv.height=VH*2;const cx=cv.getContext('2d');
    cx.fillStyle='#f4f6f8';cx.fillRect(0,0,cv.width,cv.height);
    cx.scale(2,2);cx.drawImage(img,0,0);
    cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
      a.download=`涨停思维导图_${DATA.meta.date}.png`;a.click();});};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgBlob());};

/* ---- 顶部统计 ---- */
function initStats(){
  const m=DATA.meta;
  const zb=m.zb_count!=null?Math.round(m.zb_count/(m.zb_count+m.zt_count)*100):null;
  const degraded = m.source && m.source.indexOf('akshare') >= 0;
  const s=[
    ['涨停',m.zt_count,'hot'],['最高板',m.max_lb+'板','hot'],
    ['炸板',m.zb_count!=null?m.zb_count:'-',''],
    ['炸板率',zb!=null?zb+'%':'-',zb!=null&&zb>35?'warn':''],
    ['主题域',m.theme_count,''],['细分题材',m.topic_count,''],
    ['数据源', degraded?'东财降级':'TDX', degraded?'warn':''],
  ];
  document.getElementById('stats').innerHTML=s.map(([k,v,c])=>
    `<div class="stat ${c}"><i>${k}</i><b>${v}</b></div>`).join('');
}

/* ---- go ---- */
initStats(); initThemes(); showRank();
layout(); render(); fit();
window.addEventListener('resize',fit);
