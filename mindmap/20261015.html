<!DOCTYPE html>
<html data-wb-theme="light" lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>涨停题材思维导图 2026-10-15</title>
<style>
:root{
  --bg:#f4f6f8; --bg2:#eef1f4; --card:#ffffff; --card2:#eef1f4;
  --line:#d8dee4; --txt:#1f2328; --txt2:#5b6570; --txt3:#5b6570;
  --up:#cf222e; --down:#1a7f37; --acc:#0a66c2;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt); overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
  font-size:13px;
}
.app{display:flex;flex-direction:column;height:100vh}

/* ---------- header ---------- */
header{
  display:flex;align-items:center;gap:18px;padding:10px 18px;
  background:linear-gradient(90deg,#e7f1fc,#f4f6f8);
  border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap;
}
h1{font-size:16px;font-weight:700;letter-spacing:.5px}
h1 span{color:var(--acc)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:4px 11px;display:flex;align-items:baseline;gap:6px;
}
.stat b{font-size:15px;font-weight:700}
.stat i{font-style:normal;font-size:11px;color:var(--txt3)}
.stat.hot b{color:var(--up)}
.stat.warn b{color:#9a3412}

/* ---------- layout ---------- */
.body{display:flex;flex:1;min-height:0}
aside{
  width:212px;background:var(--bg2);border-right:1px solid var(--line);
  overflow-y:auto;padding:12px;flex-shrink:0;
}
aside.right{border-right:none;border-left:1px solid var(--line);width:300px}
main{flex:1;position:relative;overflow:hidden;background:radial-gradient(circle at 30% 20%,#e7f1fc 0%,#f4f6f8 60%);cursor:grab}
main.drag{cursor:grabbing}
#stage{width:100%;height:100%;display:block}

.sec{font-size:11px;color:var(--txt3);margin:14px 0 7px;letter-spacing:1px;
  text-transform:uppercase;font-weight:700}
.sec:first-child{margin-top:0}
.btn{
  display:block;width:100%;text-align:left;background:var(--card);color:var(--txt);
  border:1px solid var(--line);border-radius:7px;padding:7px 10px;margin-bottom:5px;
  cursor:pointer;font-size:12px;transition:.15s;font-family:inherit;
}
.btn:hover{background:var(--card2);border-color:var(--acc)}
.btn.on{background:#e7f1fc;border-color:var(--acc);color:#0a66c2}
.chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt2);
  padding:5px 2px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--acc);cursor:pointer}
.hint{font-size:11px;color:var(--txt3);line-height:1.65;padding:0 2px 7px 26px}
input[type=text]{
  width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);
  border-radius:7px;padding:7px 10px;font-size:12px;font-family:inherit;outline:none;
}
input[type=text]:focus{border-color:var(--acc)}

.ti{display:flex;align-items:center;gap:7px;padding:4px 2px;font-size:12px;
  cursor:pointer;border-radius:5px;user-select:none}
.ti:hover{background:#e7f1fc}
.ti .dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.ti .n{flex:1;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti .c{color:var(--txt3);font-size:11px}
.ti.off{opacity:.35}

/* ---------- right panel ---------- */
#detail{padding:12px}
.empty{color:var(--txt3);font-size:12px;line-height:1.9;padding:8px 0}
.dt-h{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.dt-h b{font-size:17px}
.dt-h code{font-size:11px;color:var(--txt3);font-family:Consolas,monospace}
.dt-sub{font-size:11px;color:var(--txt2);margin-bottom:12px}
.kv{display:grid;grid-template-columns:66px 1fr;gap:5px 8px;font-size:12px;margin-bottom:12px}
.kv dt{color:var(--txt3)}
.kv dd{color:var(--txt)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.tag{background:#e7f1fc;border:1px solid #d8dee4;color:#0a66c2;
  border-radius:5px;padding:2px 7px;font-size:11px}
.reason{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);
  border-radius:6px;padding:9px 11px;font-size:12px;line-height:1.75;color:var(--txt2)}
.rk{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px}
.rk .r{width:16px;color:var(--txt3);font-size:11px;text-align:right}
.rk .nm{width:78px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .bar{flex:1;height:7px;background:#e7f1fc;border-radius:4px;overflow:hidden}
.rk .bar i{display:block;height:100%;background:linear-gradient(90deg,#4f8cff,#ff4d4f);border-radius:4px}
.rk .v{width:24px;text-align:right;color:var(--txt3);font-size:11px}

.tabs{display:flex;gap:4px;margin-bottom:10px}
.tab{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);
  border-radius:7px;padding:6px;font-size:12px;cursor:pointer;color:var(--txt2)}
.tab.on{background:#e7f1fc;border-color:var(--acc);color:#0a66c2}
.hide{display:none}

/* ---------- svg ---------- */
.node{cursor:pointer}
.node rect{transition:.15s}
.node:hover rect.nd{stroke:#8ab4ff;stroke-width:2}
.node.dim{opacity:.25}
path.lk{fill:none;stroke-width:1.6;transition:.15s}
path.lk.hi{stroke-width:3}
text{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
  -webkit-user-select:none;user-select:none}
.ti-sel{background:#e7f1fc !important}
#tip{position:absolute;pointer-events:none;background:#e7f1fc;border:1px solid var(--line);
  border-radius:6px;padding:5px 9px;font-size:11px;color:var(--txt);opacity:0;
  transition:opacity .12s;white-space:nowrap;z-index:9}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;gap:6px;z-index:5}
.zoom button{width:30px;height:30px;border-radius:7px;background:var(--card);
  border:1px solid var(--line);color:var(--txt);cursor:pointer;font-size:15px}
.zoom button:hover{border-color:var(--acc)}
mark{background:#ffd166;color:#111;padding:0 2px;border-radius:2px}
</style>
</head>

  const cr=!!n.isCross;                 // 副归属个股（交叉题材）
  const r=el('rect',{class:'nd',x:n.x,y:n.y-n.h/2,width:n.w,height:n.h,rx:9,
    fill:cr?'#1f2328':'#ffffff',stroke:n.color,'stroke-width':n.type==='root'?2:1.4,
    'stroke-opacity':cr?.38:(n.type==='stock'?.45:.9)});
  if(cr) r.setAttribute('stroke-dasharray','4 3');
  if(n.type==='theme'||n.type==='topic'||n.type==='root'){
    r.setAttribute('fill',hexA(n.color,n.type==='topic'?.07:.13));
  }
  g.appendChild(r);
  // 左侧色条
  if(n.type!=='root'){
    g.appendChild(el('rect',{x:n.x,y:n.y-n.h/2,width:3.5,height:n.h,rx:2,
      fill:n.color,'fill-opacity':cr?.32:(n.type==='stock'?.65:1)}));
  }

  if(n.type==='root'){
    g.appendChild(txt(n.x+14,n.y-16,n.name,15,'#111418',700));
    g.appendChild(txt(n.x+14,n.y+5,n.sub,12,'#cf222e',700));
    g.appendChild(txt(n.x+14,n.y+23,n.sub2,10.5,'#5b6570'));
  }
  else if(n.type==='theme'){
    g.appendChild(txt(n.x+14,n.y-7,n.name,14,'#1f2328',700));
    g.appendChild(txt(n.x+14,n.y+13,`${n.count}家 · 最高${n.max_lb}板`,11,'#5b6570'));
    g.appendChild(badgeR(n.x+n.w-10,n.y,`${n.count}`,n.color));
  }
  else if(n.type==='topic'){
    g.appendChild(txt(n.x+13,n.y+1,n.name,12.5,'#1f2328',600));
    let bx=n.x+n.w-10;
    if(SHOW_CROSS && n.xc){          // 副归属计数：虚线小徽标
      const b=badgeR(bx,n.y,`+${n.xc}`,'#8b949e',true);
      const br=b.querySelector('rect'); if(br) br.setAttribute('stroke-dasharray','3 2');
      g.appendChild(b);
      bx -= String(n.xc).length*8+22;
    }
    g.appendChild(badgeR(bx,n.y,`${n.count}`,hexA(n.color,.9),true));
  }
  else{
    const s=n.raw;
    g.appendChild(txt(n.x+12,n.y-6,s.name,13.5,cr?'#5b6570':'#1f2328',700));
    g.appendChild(badgeR(n.x+n.w-10,n.y-6,`${s.lb}板`,cr?'#8b949e':lbColor(n)));
    if(cr){
      g.appendChild(txt(n.x+12,n.y+13,`副归属 · 主属 ${s.topic||'-'}`,10.5,'#9aa4b0'));
    } else if(SHOWLABEL){
      const bt=s.board_type?s.board_type.replace('(涨停)',''):'';
      g.appendChild(txt(n.x+12,n.y+13,
        `封单${fmtYi(s.seal_amt)} · ${bt||s.lb_stat||''} · ${fmtTime(s.first_time)}`,
        10.5,'#5b6570'));
    }
  }
  return g;
}
function txt(x,y,s,size,fill,weight){
  const t=el('text',{x,y,'font-size':size,fill});
  if(weight)t.setAttribute('font-weight',weight);
  t.textContent=s; return t;
}
function badgeR(x,y,s,color,small){
  const w=String(s).length*(small?8:9)+14, h=small?17:19;
  const g=el('g',{});
  g.appendChild(el('rect',{x:x-w,y:y-h/2,width:w,height:h,rx:h/2,fill:color,'fill-opacity':.19,
    stroke:color,'stroke-opacity':.75,'stroke-width':1}));
  g.appendChild(txt(x-w/2,y+4,s,small?10.5:11.5,color,700)).setAttribute('text-anchor','middle');
  return g;
}
function hexA(h,a){
  const n=parseInt(h.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}

function render(){
  svg.innerHTML='';
  const defs=el('defs',{}); svg.appendChild(defs);
  const gL=el('g',{id:'links'}), gN=el('g',{id:'nodes'});
  svg.appendChild(gL); svg.appendChild(gN);
  FLAT.forEach(n=>{
    if(!n.parent) return;
    const x1=n.parent.x+n.parent.w, y1=n.parent.y, x2=n.x, y2=n.y;
    const dx=Math.max((x2-x1)/2, 26);
    const p=el('path',{class:'lk',id:'p_'+n.id,
      d:`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`,
      stroke:n.color,'stroke-opacity':n.type==='stock'?.32:.55});
    gL.appendChild(p);
  });
  FLAT.forEach(n=>{const g=nodeBody(n); gN.appendChild(g);});
  applyFilter();
  fit();
}
function transform(){
  document.getElementById('links').setAttribute('transform',`translate(${TX},${TY}) scale(${SC})`);
  document.getElementById('nodes').setAttribute('transform',`translate(${TX},${TY}) scale(${SC})`);
}

/* ============ 交互 ============ */
const main=document.getElementById('main'), tip=document.getElementById('tip');

function fit(){
  const W=main.clientWidth||1000, H=main.clientHeight||700;
  let s = Math.min((W-40)/VW, (H-40)/VH);
  s = Math.min(Math.max(s, 0.4), 1.4);
  SC=s; TX=Math.max(20,(W-VW*s)/2); TY=Math.max(12,(H-VH*s)/2);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  transform();
}
function set100(){
  const r=main.getBoundingClientRect();
  const W=r.width||1000, H=r.height||700;
  SC=1; TX=Math.max(0,(W-VW)/2); TY=Math.max(0,(H-VH)/2);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  transform();
}
function zoom(f){
  const r=main.getBoundingClientRect();
  const cx=r.width/2, cy=r.height/2;
  TX=cx-(cx-TX)*f; TY=cy-(cy-TY)*f; SC*=f; transform();
}
main.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:1/1.12);},{passive:false});
let drag=null;
main.addEventListener('mousedown',e=>{if(e.target.closest('.node'))return;
  drag={x:e.clientX-TX,y:e.clientY-TY};main.classList.add('drag');});
window.addEventListener('mousemove',e=>{if(drag){TX=e.clientX-drag.x;TY=e.clientY-drag.y;transform();}});
window.addEventListener('mouseup',()=>{drag=null;main.classList.remove('drag');});

svg.addEventListener('click',e=>{
  const g=e.target.closest('.node'); if(!g) return;
  const n=FLAT.find(x=>x.id===g.dataset.id); if(!n) return;
  if(n.type==='stock'){ showDetail(n.raw, !!n.isCross); return; }
  n.collapsed=!n.collapsed; layout(); render(); transform();
});
svg.addEventListener('mousemove',e=>{
  const g=e.target.closest('.node');
  if(!g){tip.style.opacity=0;
    document.querySelectorAll('path.lk.hi').forEach(p=>p.classList.remove('hi'));return;}
  const n=FLAT.find(x=>x.id===g.dataset.id); if(!n){return;}
  // 高亮祖先链
  document.querySelectorAll('path.lk.hi').forEach(p=>p.classList.remove('hi'));
  let c=n; while(c.parent){const p=document.getElementById('p_'+c.id); if(p)p.classList.add('hi'); c=c.parent;}
  const r=main.getBoundingClientRect();
  let t='';
  if(n.type==='stock'){const s=n.raw;
    t=`${s.name} ${s.code} · ${s.lb}板 · 封单${fmtYi(s.seal_amt)} · 换手${(+s.turnover).toFixed(1)}%`
      +(n.isCross?`　【副归属 · 主属「${s.topic||'-'}」】`:'');}
  else if(n.type==='topic') t=`${n.name} · ${n.count}家 · 最高${n.max_lb}板`;
  else if(n.type==='theme') t=`${n.name} · ${n.count}家 · 最高${n.max_lb}板`;
  else t=`${DATA.meta.date} 涨停${DATA.meta.zt_count}家`;
  tip.textContent=t; tip.style.opacity=1;
  tip.style.left=Math.min(e.clientX-r.left+14, r.width-260)+'px';
  tip.style.top=(e.clientY-r.top+16)+'px';
});
svg.addEventListener('mouseleave',()=>{tip.style.opacity=0;});

/* ---- 右侧详情 ---- */
function showDetail(s, isCross){
  document.getElementById('tDetail').click();
  const d=document.getElementById('detail');
  const ind=s.industry_full||s.industry||'-';
  const tags=(s.reason_tags||[]).filter(t=>t);
  d.innerHTML=`
    <div class="dt-h"><b>${esc(s.name)}</b><code>${s.code}</code>
      <span style="background:${lbColor({raw:s})};color:#fff;border-radius:5px;
        padding:2px 8px;font-size:11px;font-weight:700">${s.lb}板</span></div>
    <div class="dt-sub">${(+s.price).toFixed(2)} 元　
      <span style="color:var(--up)">+${(+s.chg).toFixed(2)}%</span>　${esc(ind)}　${esc(s.lb_stat||'')}</div>
    ${isCross?`<div class="reason" style="border-left-color:#8b949e;margin-bottom:12px">
      当前为<b>副归属</b>节点：该股主属「${esc(s.domain||'-')} / ${esc(s.topic||'-')}」分支，
      此处因题材标签重合而交叉出现。</div>`:''}
    <dl class="kv">
      <dt>板型</dt><dd>${esc(s.board_type||'-')}</dd>
      <dt>首封</dt><dd>${fmtTime(s.first_time)}　末封 ${fmtTime(s.last_time)}</dd>
      <dt>炸板</dt><dd>${s.open_times} 次</dd>
      <dt>封单</dt><dd>${fmtYi(s.seal_amt)}　封成比 ${(+s.seal_ratio).toFixed(1)}</dd>
      <dt>成交额</dt><dd>${fmtYi(s.amount)}</dd>
      <dt>换手率</dt><dd>${(+s.turnover).toFixed(2)}%</dd>
      <dt>流通市值</dt><dd>${fmtYi(s.float_mv)}</dd>
      <dt>主属题材</dt><dd>${esc(s.topic||'-')}</dd>
    </dl>
    <div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')||'<span class="tag">-</span>'}</div>
    <div class="reason">${esc(s.reason_text||'暂无涨停原因')}</div>`;
}

/* ---- 题材强度榜 ---- */
function showRank(){
  const r=document.getElementById('rank');
  const mx=Math.max(...DATA.rank.map(x=>x.count));
  r.innerHTML=`<div class="sec" style="margin-top:0">细分题材 · 涨停家数</div>`+
    DATA.rank.map((x,i)=>`
      <div class="rk">
        <div class="r">${i+1}</div>
        <div class="nm" title="${esc(x.name)}">${esc(x.name)}</div>
        <div class="bar"><i style="width:${x.count/mx*100}%"></i></div>
        <div class="v">${x.count}</div>
      </div>`).join('');
}

/* ---- 主题域筛选 ---- */
const themeState={};
function initThemes(){
  const box=document.getElementById('themes');
  box.innerHTML=DATA.themes.map((t,i)=>`
    <div class="ti" data-i="${i}">
      <div class="dot" style="background:${t.color}"></div>
      <div class="n">${esc(t.name)}</div><div class="c">${t.count}</div>
    </div>`).join('');
  box.querySelectorAll('.ti').forEach(d=>{
    d.onclick=()=>{const i=d.dataset.i;
      themeState[i]=!themeState[i]; d.classList.toggle('off',!!themeState[i]);
      applyFilter();};
  });
}
function applyFilter(){
  FLAT.forEach(n=>{
    const g=document.querySelector(`.node[data-id="${n.id}"]`);
    const p=document.getElementById('p_'+n.id);
    let dim=false;
    if(n.type==='theme'&&themeState[n.raw?DATA.themes.indexOf(n.raw):-1]) dim=true;
    else if(n.parentType) {}
    if(n.type==='topic'&&themeState[n.parent?DATA.themes.indexOf(n.parent.raw):-1]) dim=true;
    if(n.type==='stock'&&themeState[n.parent&&n.parent.parent?DATA.themes.indexOf(n.parent.parent.raw):-1]) dim=true;
    if(HIDE_LONE&&n.type==='topic'&&n.count===1) dim=true;
    if(g)g.classList.toggle('dim',dim);
    if(p)p.style.opacity=dim?.06:'';
  });
  if(Q){highlight(Q);}
}

/* ---- 搜索 ---- */
let Q='';
function highlight(q){
  Q=q=q.trim();
  document.querySelectorAll('.node').forEach(g=>g.classList.remove('dim'));
  if(!q){applyFilter();return;}
  FLAT.forEach(n=>{
    if(n.type==='root')return;
    const s=n.raw;
    let hit=false;
    if(n.type==='stock') hit=s.name.includes(q)||s.code.includes(q)||
      (s.reason_text||'').includes(q)||(s.reason_tags||[]).some(t=>t.includes(q));
    else hit=n.name.includes(q);
    const g=document.querySelector(`.node[data-id="${n.id}"]`);
    if(g)g.classList.toggle('dim',!hit);
  });
}
document.getElementById('q').addEventListener('input',e=>highlight(e.target.value));

/* ---- 工具按钮 ---- */
function setAll(c){FLAT.forEach(n=>{if(n.type!=='stock')n.collapsed=c;});layout();render();transform();}
document.getElementById('bFit').onclick=fit;
document.getElementById('b100').onclick=set100;
document.getElementById('bExpand').onclick=()=>setAll(false);
document.getElementById('bCollapse2').onclick=()=>{setAll(false);
  FLAT.forEach(n=>{if(n.type==='topic')n.collapsed=true;});layout();render();transform();};
document.getElementById('bCollapse1').onclick=()=>{setAll(true);};
document.getElementById('cCross').onchange=e=>{
  SHOW_CROSS=e.target.checked;
  syncCross();
  layout(); render(); transform();
};
document.getElementById('cLone').onchange=e=>{HIDE_LONE=e.target.checked;applyFilter();};
document.getElementById('cLabel').onchange=e=>{SHOWLABEL=e.target.checked;render();transform();};
document.getElementById('zIn').onclick=()=>zoom(1.2);
document.getElementById('zOut').onclick=()=>zoom(1/1.2);

document.getElementById('tDetail').onclick=()=>{
  document.getElementById('tDetail').classList.add('on');
  document.getElementById('tRank').classList.remove('on');
  document.getElementById('detail').classList.remove('hide');
  document.getElementById('rank').classList.add('hide');};
document.getElementById('tRank').onclick=()=>{
  document.getElementById('tRank').classList.add('on');
  document.getElementById('tDetail').classList.remove('on');
  document.getElementById('detail').classList.add('hide');
  document.getElementById('rank').classList.remove('hide');};

/* ---- 导出 ---- */
function svgBlob(){
  const c=svg.cloneNode(true);
  c.setAttribute('xmlns',NS);
  c.setAttribute('width',VW); c.setAttribute('height',VH);
  c.setAttribute('viewBox',`0 0 ${VW} ${VH}`);
  c.querySelector('#links').setAttribute('transform','translate(0,0) scale(1)');
  c.querySelector('#nodes').setAttribute('transform','translate(0,0) scale(1)');
  const st=document.createElement('style');
  st.textContent='text{font-family:"Microsoft YaHei",sans-serif}';
  c.insertBefore(st,c.firstChild);
  return new XMLSerializer().serializeToString(c);
}
document.getElementById('bSvg').onclick=()=>{
  const b=new Blob([svgBlob()],{type:'image/svg+xml'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=`涨停思维导图_${DATA.meta.date}.svg`;a.click();};
document.getElementById('bPng').onclick=()=>{
  const img=new Image();
  img.onload=()=>{const cv=document.createElement('canvas');
    cv.width=VW*2;cv.height=VH*2;const cx=cv.getContext('2d');
    cx.fillStyle='#f4f6f8';cx.fillRect(0,0,cv.width,cv.height);
    cx.scale(2,2);cx.drawImage(img,0,0);
    cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
      a.download=`涨停思维导图_${DATA.meta.date}.png`;a.click();});};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgBlob());};

/* ---- 顶部统计 ---- */
function initStats(){
  const m=DATA.meta;
  const zb=m.zb_count!=null?Math.round(m.zb_count/(m.zb_count+m.zt_count)*100):null;
  const degraded = m.source && m.source.indexOf('akshare') >= 0;
  const s=[
    ['涨停',m.zt_count,'hot'],['最高板',m.max_lb+'板','hot'],
    ['炸板',m.zb_count!=null?m.zb_count:'-',''],
    ['炸板率',zb!=null?zb+'%':'-',zb!=null&&zb>35?'warn':''],
    ['主题域',m.theme_count,''],['细分题材',m.topic_count,''],
    ['副归属',m.x_on?m.x_total:'-',''],
    ['数据源', degraded?'东财降级':'TDX', degraded?'warn':''],
  ];
  document.getElementById('stats').innerHTML=s.map(([k,v,c])=>
    `<div class="stat ${c}"><i>${k}</i><b>${v}</b></div>`).join('');
}

/* ---- go ---- */
initStats(); initThemes(); showRank();
layout(); render(); fit();
window.addEventListener('resize',fit);
</script>
</body>
